<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario CRUD</title>
</head>
<body>
    <h1>Formulario CRUD</h1>
    <form method="POST" action="formulario.html">
        <label for="user">Usuario:</label>
        <input type="text" id="user" name="user" value="{{ record.user if record else '' }}" required>
        
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" value="{{ record.password if record else '' }}" required>
        
        <button type="submit">{{ 'Crear' if not record else 'Actualizar' }}</button>
</body>
</html>
